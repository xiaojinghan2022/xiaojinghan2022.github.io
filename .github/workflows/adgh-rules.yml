name: ADGH Rules

on:
    push:
        paths:
            - 'openclash/rule/*PROXYRule*.yaml'
            - 'openclash/rule/*PROXYRule*.yml'
    workflow_dispatch:
jobs:
    extract:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        
        steps:
          - name: Checkout repository
            uses: actions/checkout@v7
          - name : Install yq
            run: |
                wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
                chmod +x /usr/local/bin/yq
          - name: Extract domains from PROXYRule YAMLs
            run: |
                mkdir -p adguardhome
                > adguardhome/adgh-rules.txt
                # 遍历所有文件名包含 PROXYRule 的 YAML 文件
                find openclash/rule -type f \( -name "*PROXYRule*.yaml" -o -name "*PROXYRule*.yml" \) | while read -r file; do
                    echo "Processing $file ..."
                    # 使用 yq 提取 payload 数组的每个元素
                    # 去掉 '+.' 和引号
                    yq eval '.payload[]' "$file" 2>/dev/null | while read -r entry; do
                        # 去掉可能的首尾空格和引号
                        entry=$(echo "$entry" | sed "s/^['\"]//;s/['\"]$//;s/^[[:space:]]*//;s/[[:space:]]*$//")
                        if [ -z "$entry" ]; then
                        continue
                        fi
                        if [[ "$entry" == "+."* ]]; then
                            domain=$(echo "$entry" | sed -E "s/^\+\.//")
                            printf '||%s^$dnstype=AAAA,dnsrewrite=NOERROR\n' "$domain" >> adguardhome/adgh-rules.txt
                        else
                            # 纯域名（不含 +.）：精确匹配，只匹配域名本身
                            domain="$entry"
                            printf '|%s$dnstype=AAAA,dnsrewrite=NOERROR\n' "$domain" >> adguardhome/adgh-rules.txt
                        fi
                    done
                done
                # 去重
                sort -u adguardhome/adgh-rules.txt -o adguardhome/adgh-rules.txt

          - name: Commit and push if changed
            run: |
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git add adguardhome/adgh-rules.txt
                git diff --staged --quiet || git commit -m "Auto-generate AdGuardHome rules in adguardhome/ directory"
                git push