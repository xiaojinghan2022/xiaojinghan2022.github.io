name: merge ipcidr rules
on:
    push:
        paths:
            - 'openclash/YAML'
    workflow_dispatch:
jobs:
    merge-ipcidr:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                python-version: '3.x'
            - name: Merge ipcidr rules
              run: |
                if [ ! -f openclash/YAML ]; then
                    echo "Error: openclash/YAML Not found"
                    exit 1
                fi
                awk -v exc_file="openclash/YAML" '
                    BEGIN { while((getline < exc_file) > 0) exc[$0]=1 }
                    END {
                        for(i=0;i<256;i++) {
                            for(j=0;j<256;j++) {
                                ip="192.168."i"."j
                                if (!(ip in exc)) print ip
                            }
                            ip="10.8.0."i
                            if (!(ip in exc)) print ip
                            ip="10.253.0."i
                            if (!(ip in exc)) print ip
                        }
                    }' /dev/null > full_ips.txt
                cat > merge_ipcidr.py <<'EOF'
                #!/usr/bin/env python3
                import sys
                import ipaddress

                def main():
                    enabled_ips = set()

                    for line in sys.stdin:
                        ip_str = line.strip()
                        if not ip_str:
                            continue
                        try:
                            enabled_ips.add(ipaddress.ip_address(ip_str))
                        except ValueError:
                            continue

                    if not enabled_ips:
                        return

                    sorted_ips = sorted(enabled_ips)

                    # 按连续 IP 分组
                    ranges = []
                    start = sorted_ips[0]
                    prev = sorted_ips[0]

                    for ip in sorted_ips[1:]:
                        if ip == prev + 1:
                            prev = ip
                        else:
                            ranges.append((start, prev))
                            start = prev = ip
                    ranges.append((start, prev))

                    # 把每个连续段转成最小 CIDR
                    for start, end in ranges:
                        for net in ipaddress.summarize_address_range(start, end):
                            print(f"  - SRC-IP-CIDR, {net},DIRECT")

                if __name__ == "__main__":
                    main()
                EOF

                chmod +x merge_ipcidr.py
                mkdir -p openclash
                python3 merge_ipcidr.py < full_ips.txt > openclash/SRC-IPCIDR
            - name: Commit and push changes
              run: |
                if [ ! -s openclash/SRC-IPCIDR ]; then
                    echo "Output file is empty. Exiting with error."
                    exit 1
                fi
                sed -i '1i[YAML]\n+<rules>:' openclash/SRC-IPCIDR
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git add openclash/SRC-IPCIDR
                git diff --staged --quiet || git commit -m "Update ipcidr rules"
                git push
