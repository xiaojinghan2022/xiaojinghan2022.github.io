[YAML]
<proxy-groups>+:
  - name: DLsite
    type: select
    proxies:
      - Proxy
      - DIRECT
      - HK
      - JP
      - SG
      - TW
      - US
  - name: e-hentai
    type: select
    proxies:
      - Proxy
      - SG
      - US
  - name: DIRECT-Steam
    type: select
    proxies:
      - DIRECT
      - Steam
  - name: Route-optimization
    type: select
    proxies:
      - Proxy
      - DIRECT
      - HK
      - JP
      - SG
      - TW
      - US

<proxy-groups>*:
  where:
    name: '/^(?!.*(?:^HK$|^SG$|^JP$|^US$|^TW$|^KR$|^Proxy$|^Proxies$|DIRECT)).+$/'
    type: select
  set:
    +proxies:
      - Proxy

domain_rule: &domain_rule
  type: http
  behavior: domain
  format: yaml
  interval: 43200

ip_rule: &ip_rule
  type: http
  behavior: ipcidr
  format: yaml
  interval: 43200

+<rule-providers>:
  reject-list:
    <<: *domain_rule
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt
    path: ./rule_provider/reject.txt
  direct_rule:
    <<: *domain_rule
    url: https://github.lctianxing.top/openclash/rule/DIRECTRule.yaml
    path: ./rule_provider/DIRECTRule.yaml
  direct_steam:
    <<: *domain_rule
    url: https://github.lctianxing.top/openclash/rule/DIRECTRule-Steam.yaml
    path: ./rule_provider/DIRECTRule-Steam.yaml
  bilibili:
    <<: *domain_rule
    url: https://github.lctianxing.top/openclash/rule/Bilibili.yaml
    path: ./rule_provider/Bilibili.yaml
  route-optimization:
    <<: *domain_rule
    url: https://github.lctianxing.top/openclash/rule/PROXYRule-Route-optimization.yaml
    path: ./rule_provider/PROXYRule-Route-optimization.yaml
  proxy_rule:
    <<: *domain_rule
    url: https://github.lctianxing.top/openclash/rule/PROXYRule.yaml
    path: ./rule_provider/PROXYRule.yaml
  proxy_steam:
    <<: *domain_rule
    url: https://github.lctianxing.top/openclash/rule/PROXYRule-Steam.yaml
    path: ./rule_provider/PROXYRule-Steam.yaml
  proxy_us:
    <<: *domain_rule
    url: https://github.lctianxing.top/openclash/rule/PROXYRule-US.yaml
    path: ./rule_provider/PROXYRule-US.yaml
  proxy_openai:
    <<: *domain_rule
    url: https://github.lctianxing.top/openclash/rule/PROXYRule-OpenAI.yaml
    path: ./rule_provider/PROXYRule-OpenAI.yaml
  proxy_dlsite:
    <<: *domain_rule
    url: https://github.lctianxing.top/openclash/rule/PROXYRule-DLsite.yaml
    path: ./rule_provider/PROXYRule-DLsite.yaml
  proxy_cloudflare:
    <<: *domain_rule
    url: https://github.lctianxing.top/openclash/rule/PROXYRule-Cloudflare.yaml
    path: ./rule_provider/PROXYRule-Cloudflare.yaml
  proxy_google:
    <<: *domain_rule
    url: https://github.lctianxing.top/openclash/rule/PROXYRule-Google.yaml
    path: ./rule_provider/PROXYRule-Google.yaml
  proxy_microsoft:
    <<: *domain_rule
    url: https://github.lctianxing.top/openclash/rule/PROXYRule-Microsoft.yaml
    path: ./rule_provider/PROXYRule-Microsoft.yaml
  proxy_ip:
    <<: *ip_rule
    url: https://github.lctianxing.top/openclash/rule/PROXYIP.yaml
    path: ./rule_provider/PROXYIP.yaml
  proxy_ip_google:
    <<: *ip_rule
    url: https://github.lctianxing.top/openclash/rule/PROXYIP-Google.yaml
    path: ./rule_provider/PROXYIP-Google.yaml
  proxy_ip_cloudflare:
    <<: *ip_rule
    url: https://github.lctianxing.top/openclash/rule/PROXYIP-Cloudflare.yaml
    path: ./rule_provider/PROXYIP-Cloudflare.yaml

+<rules>:
  - RULE-SET,reject-list,REJECT
  - RULE-SET,route-optimization,Route-optimization
  - RULE-SET,proxy_steam,Steam
  - RULE-SET,proxy_us,US
  - RULE-SET,proxy_openai,OpenAI
  - RULE-SET,proxy_dlsite,DLsite
  - RULE-SET,proxy_cloudflare,Cloudflare
  - RULE-SET,proxy_microsoft,Microsoft
  - RULE-SET,direct_steam,DIRECT-Steam
  - RULE-SET,bilibili,Bilibili
  - DOMAIN-REGEX,^chatgpt-async-webps-prod-\S+-\d+\.webpubsub\.azure\.com$,OpenAI
  - RULE-SET,proxy_google,Google
  - RULE-SET,proxy_ip_google,Google,no-resolve
  - RULE-SET,proxy_ip_cloudflare,Cloudflare,no-resolve
  - RULE-SET,proxy_ip,Proxy,no-resolve
  - RULE-SET,proxy_rule,Proxy
  - RULE-SET,direct_rule,DIRECT
