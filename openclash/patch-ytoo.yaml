[YAML]
proxy-groups+:
  - name: KR
    type: select
    include-all: true
    exclude-type: direct
    filter: "(?i)韩国|kr"
  - name: Proxy
    #type: select
    type: url-test
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    fallback: DIRECT
    proxies:
      - Proxies
proxy-groups*:
  where:
    name: Proxies
    type: select
  set:
    proxies-:
      - 'HK'
      - 'JP'
      - 'SG'
      - 'TW'
      - 'US'
    +proxies:
      - 'HK'
      - 'JP'
      - 'SG'
      - 'TW'
      - 'US'
      - 'KR'