[YAML]
<proxy-groups>+:
  - name: Proxy
    #type: select
    type: url-test
    url: "http://cp.cloudflare.com/generate_204"
    interval: 300
    fallback: DIRECT
    proxies:
      - Proxies
<proxy-groups>*:
  where:
    name: '/^(?!.*(?:^HK$|^SG$|^JP$|^US$|^TW$|^KR$|^Proxy$|^Proxies$)).+$/'
    type: select
  set:
    +proxies:
      - Proxy